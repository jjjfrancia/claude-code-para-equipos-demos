name: Verificación del Tutor
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 1 }
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/dod"
          claude_args: |
            --permission-mode dontAsk
            --permission-prompts none
            --max-turns 25
            --max-budget-usd 1.50
            --allowedTools "Read,Grep,Glob,Bash(pytest *),Bash(ruff *),Bash(git diff *)"
